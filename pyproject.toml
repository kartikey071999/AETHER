[project]
name = "aether"
version = "0.1.0"
description = "A local-first, persistent multi-agent runtime"
readme = "README.md"
authors = [
    { name = "Kartikey Gupta", email = "kartikey071999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psutil>=6.1,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.3.6",
    "openai>=3.41.0",
    "anthropic>=2.3.0",
    "requests>=2.34.2",
    "groq>=1.7.0",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
aether = "aether.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in real provider smoke tests (AETHER_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
